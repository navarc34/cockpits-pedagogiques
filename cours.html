<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit de cours</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f2efe7; --card:#fbf9f2; --ink:#1f2b2a; --soft:#5f6d68; --line:#e0dcd0;
  --terra:#c2603f; --sea:#3d6b78; --forest:#5b7150; --plum:#7d5480; --gold:#a5842e; --red:#b03d38; --slate:#8a9aa5;
  --c:#c2603f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1460px;margin:0 auto;padding:0 clamp(14px,2.6vw,44px)}
a{color:inherit}
/* header */
.hero{padding:34px 0 10px;border-bottom:1px solid var(--line)}
.back{font-size:12px;font-weight:700;color:var(--soft);text-decoration:none}
.back:hover{color:var(--ink)}
.kicker{letter-spacing:.22em;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--c);margin-top:14px;display:block}
h1{font:600 clamp(26px,3.8vw,44px)/1.06 'Fraunces',Georgia,serif;margin:8px 0 6px;letter-spacing:-.02em}
.sub{color:var(--soft);font-size:13px;margin:0;max-width:900px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0 20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.kpi b{display:block;font:600 24px 'Fraunces',serif}
.kpi b i{font:700 11px 'Inter';font-style:normal;color:var(--soft);letter-spacing:.06em}
.kpi span{font-size:11px;color:var(--soft)}
.kpi .bar{height:6px;border-radius:5px;background:#e8e4d7;overflow:hidden;display:flex;margin-top:8px}
.kpi .bar i{display:block;height:100%;background:var(--c)}
/* briefing */
.alertbar{display:none;margin:16px 0 0;background:#fff7e8;border:1px solid #ead6ae;border-left:5px solid var(--gold);border-radius:12px;padding:11px 14px;font-size:12.5px;color:#5e5137}
.alertbar.on{display:flex;gap:10px;align-items:flex-start}.alertbar b{color:var(--ink)}
.pilot{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:16px}
.pilot-main,.pilot-side{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px}
.pilot-main{border-left:5px solid var(--c)}
.pilot-label{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--c)}
.pilot-main h3{font:600 22px 'Fraunces',serif;margin:5px 0 8px}.pilot-main p{font-size:13px;color:var(--soft);margin:0}
.pilot-actions{list-style:none;margin:13px 0 0;padding:0}.pilot-actions li{padding:9px 0;border-top:1px solid #efece1;font-size:13px}.pilot-actions li:first-child{border-top:0}
.metric{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid #efece1}.metric:first-of-type{border-top:0}.metric b{font:600 20px 'Fraunces',serif}.metric span{font-size:11.5px;color:var(--soft);text-align:right}
@media(max-width:820px){.pilot{grid-template-columns:1fr}}
/* nav */
nav.tabs{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;gap:7px;overflow-x:auto;padding:10px 0;scrollbar-width:thin;border-bottom:1px solid var(--line)}
nav.tabs a{flex:none;text-decoration:none;font-size:12.5px;font-weight:700;color:var(--soft);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px}
nav.tabs a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
nav.tabs a:hover:not(.on){background:#efeadb}
/* sections */
section{display:none;margin-top:26px;animation:fade .18s}
section.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
h2{font:600 23px 'Fraunces',serif;margin:0 0 4px}
.shead small{color:var(--soft);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px}
.card h3{font:600 18px 'Fraunces',serif;margin:0 0 10px}
.card ul{list-style:none;margin:0;padding:0}
.card li{padding:8px 0;border-top:1px solid #efece1;font-size:13px;color:#4d5b58}
.card li:first-child{border-top:0}
/* statuts */
.st{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:3px 8px;color:#fff}
.st.publie{background:#7d8f6a}.st.distanciel{background:var(--gold)}.st.non-publie{background:#c98a3a}.st.a-saisir{background:#8a9aa5}
/* pronote */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 12px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:700 11.5px 'Inter';color:var(--soft);cursor:pointer}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seances{display:flex;flex-direction:column;gap:10px}
.seance{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.seance .head{display:flex;gap:14px;align-items:flex-start;padding:15px 18px;cursor:pointer}
.seance .head:hover{background:#f8f5ec}
.seance .date{flex:none;width:88px;text-align:center;border-right:1px solid #efece1;padding-right:14px}
.seance .date b{display:block;font:600 20px 'Fraunces',serif}
.seance .date span{font-size:10px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.seance .body{flex:1;min-width:0}
.seance .t{font-weight:700;font-size:14px;margin:0 0 3px}
.seance .r{font-size:12.5px;color:var(--soft);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seance .flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.seance .body .open{flex:none;color:var(--soft);font-size:18px;font-weight:700;padding:2px 4px}
.seance .detail{display:none;border-top:1px solid var(--line);padding:18px 20px;background:#faf8f1}
.seance.open .detail{display:block}
.detail h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin:0 0 7px;font-weight:800}
.detail .content{white-space:pre-wrap;font-size:13px;color:#424f4c;max-height:420px;overflow:auto;padding-right:8px}
.detail .els{margin-top:14px}
.detail .els li{padding:6px 0;border-top:1px solid #efece1;font-size:12.5px;color:#4d5b58}
.tag-chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:600;color:var(--soft);margin:0 6px 6px 0}
/* timeline */
.tl-viewport{overflow-x:auto;border:1px solid #d5d0c2;border-radius:16px;background:var(--card);box-shadow:0 16px 50px #22302d0d;scrollbar-width:thin}
.tl-scale{display:flex;border-bottom:1px solid var(--line);min-width:100%}
.tl-scale div{flex:1;padding:10px 0 9px;text-align:center;border-left:1px solid #e8e3d5;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.tl-scale div:first-child{border-left:0}
.tl-scale b{display:block;font:600 15px 'Fraunces',serif;color:var(--ink);text-transform:none;letter-spacing:0}
.tl-row{position:relative;height:150px;border-bottom:1px solid #edeade;min-width:2180px}
.tl-row:last-child{border-bottom:0}
.tl-vac{position:absolute;top:0;bottom:0;background:rgba(181,161,120,.12);border-left:1px dashed #c9b58c;border-right:1px dashed #c9b58c;z-index:1}
.tl-sep{position:absolute;top:0;bottom:0;width:1px;background:#e8e3d5;z-index:1}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--terra);z-index:9}
.tl-ev{position:absolute;z-index:5;border:0;background:none;padding:0;cursor:pointer;transform:translateX(-50%);text-align:center}
.tl-ev i{display:block;width:11px;height:11px;border-radius:50%;margin:0 auto 0;border:2px solid var(--card)}
.tl-ev span{display:block;margin-top:4px;font-size:9.5px;font-weight:700;color:var(--ink);max-width:110px;line-height:1.25;white-space:normal}
.tl-ev.done i{background:#7d8f6a}.tl-ev.now i{background:var(--terra);animation:pulse 1.8s infinite}.tl-ev.todo i{background:#b9c4cf}
.tl-ev.exam i{background:var(--red)}.tl-ev.insp i{background:var(--plum)}.tl-ev.vac i{background:var(--gold)}
@keyframes pulse{50%{transform:scale(1.4)}}
.tl-legend{display:flex;gap:15px;flex-wrap:wrap;padding:12px 18px;font-size:11px;color:var(--soft);border-top:1px solid var(--line)}
.tl-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
/* séquences */
.seq{border-left:5px solid var(--c);position:relative}
.seq .no{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.seq h3{margin:4px 0 2px}
.seq .per{font-size:11.5px;color:var(--soft);font-weight:700;margin-bottom:8px}
.seq .det{font-size:12.5px;color:#4d5b58}
.badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:3px 9px;margin-left:8px;vertical-align:2px}
.badge.ok{background:#7d8f6a;color:#fff}.badge.work{background:var(--gold);color:#fff}.badge.plan{background:#b9c4cf;color:#4c5c67}.badge.chantier{background:#c98a3a;color:#fff}
/* programme */
.bloc{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 20px}
.bloc h3{font:600 16px 'Fraunces',serif;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bloc h3 small{font:700 11px 'Inter';color:var(--soft)}
.bloc .cov{height:6px;border-radius:5px;background:#e8e4d7;overflow:hidden;margin:10px 0 12px;display:flex}
.bloc .cov i{display:block;height:100%;background:var(--forest)}
.it{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid #efece1;font-size:12.5px}
.it:first-of-type{border-top:0}
.it .n{flex:none;min-width:26px;text-align:center;font-size:10px;font-weight:800;border-radius:5px;padding:3px 4px;margin-top:1px}
.it .n.vu{background:#7d8f6a;color:#fff}.it .n.pas{background:#e8e4d7;color:var(--soft)}
.it.vu .lbl{color:#37453f}.it.pas .lbl{color:var(--soft)}
/* grammaire & culture */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.it2{padding:10px 0;border-top:1px solid #efece1;font-size:13px}
.it2:first-child{border-top:0}
.it2 b{display:block}
.it2 small{color:var(--soft)}
.mots{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.mot{background:var(--ink);color:#fff;border-radius:8px;padding:6px 13px;font:600 13px 'Fraunces',serif;font-style:italic}
/* modale */
.veil{position:fixed;inset:0;background:#16211f7a;z-index:60;display:none;align-items:center;justify-content:center;padding:22px}
.veil.open{display:flex}
.pop{position:relative;max-width:560px;width:100%;background:var(--card);border-radius:15px;padding:28px;box-shadow:0 30px 90px #0c1513aa;max-height:85vh;overflow:auto}
.pop .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border:0;border-radius:50%;background:#efece1;cursor:pointer;font-size:18px}
footer{margin:56px 0 36px;color:#9a958a;font-size:11.5px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
<header class="hero" id="hero">
  <a class="back" href="index.html">← Cockpit général</a>
  <span class="kicker" id="kick"></span>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="kpis" id="kpis"></div>
  <div class="alertbar" id="alertbar"></div>
  <nav class="tabs" id="tabs"></nav>
</header>

<section id="pilotage"></section>
<section id="synthese"></section>
<section id="priorites"></section>
<section id="pronote"></section>
<section id="timeline"></section>
<section id="progression"></section>
<section id="programme"></section>
<section id="grammaire"></section>
<section id="culture"></section>

<footer id="foot"></footer>
</div>

<div class="veil" id="veil" role="dialog" aria-modal="true"><div class="pop"><button class="x" id="xClose" aria-label="Fermer">×</button><div id="popBody"></div></div></div>

<script>
const $=s=>document.querySelector(s);
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtS=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const _n=new Date(), NOW=`${_n.getFullYear()}-${String(_n.getMonth()+1).padStart(2,'0')}-${String(_n.getDate()).padStart(2,'0')}`;
const MOIS=['Septembre','Octobre','Novembre','Décembre','Janvier','Février','Mars','Avril','Mai','Juin'];
const JALON_ICON={ds:'DS',controle:'Contrôle',inspection:'Inspection','bac-blanc':'Bac blanc',conseil:'Conseil',lecture:'Lecture',eaf:'EAF',essai:'Essai',jalon:'Jalon',cours:'Cours',objectif:'Objectif',retour:'Reprise',dm:'DM',alerte:'Alerte'};

async function main(){
  const params=new URLSearchParams(location.search);
  const id=params.get('id')||'fr';
  let d=null;
  try{ d=await (await fetch(`data/${id}.json`)).json(); }
  catch(e){ d=await (await fetch('data/fr.json')).json(); }
  document.documentElement.style.setProperty('--c',d.meta.couleur||'#c2603f');

  // header
  $('#kick').textContent='Cockpit de cours · Lycée · 2026-2027';
  $('#title').textContent=d.meta.nom;
  $('#sub').innerHTML=`${d.meta.classe} · créneaux : ${d.meta.creneaux} (${d.meta.rythme}). ${esc(d.meta.noteMultiniveau||'')}`;
  const pct=Math.round(d.budget.consomme/d.budget.total*100);
  const nPub=d.seances.filter(s=>s.statut==='publié').length, nDist=d.seances.filter(s=>s.statut==='distanciel').length;
  const nSais=d.seances.filter(s=>s.statut==='à saisir').length;
  const proches=d.jalons.filter(j=>j.date>=NOW && j.etat==='à venir').slice(0,2);
  $('#kpis').innerHTML=`
    <div class="kpi"><b>${d.budget.consomme}<i> h</i></b><span>heures consommées</span><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="kpi"><b>${d.budget.aVenir}<i> h</i></b><span>heures à venir (sur ${d.budget.total} h planifiées)</span><div class="bar"><i style="width:100%;background:#e8e4d7"></i></div></div>
    <div class="kpi"><b>${nPub}<i>/${d.seances.length}</i></b><span>séances saisies et publiées${nDist?` · ${nDist} en distanciel`:''}</span></div>
    <div class="kpi"><b>${nSais}</b><span>créneaux passés ou proches à saisir dans Pronote</span></div>
    <div class="kpi"><b>${pct}<i>%</i></b><span>de l\u2019année écoulée · ${proches.length?`prochain jalon : ${fmtS(proches[0].date)}`:''}</span></div>`;

  // tabs
  const TABS=[['pilotage','Pilotage'],['synthese','Synthèse'],['priorites','Priorités'],['pronote','Pronote détaillé'],['timeline','Timeline annuelle'],['progression','Progression'],['programme','Programme'],['grammaire','Grammaire'],['culture','Auteurs & culture']];
  $('#tabs').innerHTML=TABS.map(([k,t])=>`<a href="#${k}" data-t="${k}">${t}</a>`).join('');
  const show=k=>{document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===k));
    document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===k));};
  const route=()=>{const h=location.hash.replace('#','');show(TABS.some(t=>t[0]===h)?h:'pilotage');};
  document.querySelectorAll('nav.tabs a').forEach(a=>a.addEventListener('click',()=>setTimeout(route,0)));
  window.addEventListener('hashchange',route);route();

  /* ===== Pilotage ===== */
  const pastDue=d.jalons.filter(j=>j.etat==='à venir'&&j.date<NOW);
  const toEnter=d.seances.filter(s=>s.statut==='à saisir');
  const nextJ=d.jalons.filter(j=>j.etat==='à venir'&&j.date>=NOW).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const urgent=(d.priorites.court||[]).filter(p=>!p.fait).slice(0,5);
  const items=d.programme.reduce((a,b)=>a.concat(b.items),[]), covered=items.filter(i=>i.n>0).length;
  const coverage=items.length?Math.round(covered/items.length*100):0;
  const grammarLeft=(d.grammaire.aVoir||[]).length;
  const alerts=[];
  if(pastDue.length)alerts.push(`${pastDue.length} jalon(s) daté(s) comme « à venir » sont maintenant dépassés`);
  if(toEnter.length)alerts.push(`${toEnter.length} créneau(x) restent à saisir dans Pronote`);
  if(alerts.length){$('#alertbar').classList.add('on');$('#alertbar').innerHTML=`<b>À vérifier</b><span>${alerts.join(' · ')}</span>`;}
  const lead=urgent[0]?.txt || nextJ?.txt || 'Poursuivre la progression planifiée';
  $('#pilotage').innerHTML=`<div class="shead"><h2>Pilotage</h2><small>une vue pour décider, pas seulement constater · aujourd’hui : ${fmtS(NOW)}</small></div>
    <div class="pilot"><div class="pilot-main"><div class="pilot-label">Action dominante</div><h3>${esc(lead)}</h3>
      <p>${nextJ?`Prochain jalon daté : <b>${fmtD(nextJ.date)}</b> — ${esc(nextJ.txt)}.`:'Aucun jalon futur daté dans les données.'}</p>
      <ul class="pilot-actions">${urgent.map((p,i)=>`<li><b>${i+1}.</b> ${esc(p.txt)} ${p.echeance?`<small style="color:var(--soft)">· ${esc(p.echeance)}</small>`:''}</li>`).join('')||'<li>Aucune priorité court terme non cochée.</li>'}</ul></div>
    <div class="pilot-side"><div class="pilot-label">Signaux de trajectoire</div>
      <div class="metric"><b>${pct}%</b><span>budget d’heures consommé</span></div>
      <div class="metric"><b>${coverage}%</b><span>items du référentiel déjà abordés</span></div>
      <div class="metric"><b>${grammarLeft}</b><span>points de langue encore identifiés « à voir »</span></div>
      <div class="metric"><b>${toEnter.length}</b><span>créneaux à saisir / régulariser</span></div>
      <div class="metric"><b>${pastDue.length}</b><span>jalons potentiellement en retard</span></div></div></div>`;

  /* ===== Synthèse ===== */
  const seqCards=(d.progression.sequences||[]).map(s=>`<div class="card seq" style="--c:${s.couleur}">
    <span class="no">${s.no} · ${esc(s.periode)}</span>
    <h3>${esc(s.titre)}<span class="badge ${s.etat.startsWith('en cours')?'work':s.etat.startsWith('planifi')||s.etat.startsWith('à lancer')?'plan':s.etat.startsWith('faite')||s.etat.startsWith('clos')?'ok':'work'}">${esc(s.etat)}</span></h3>
    <p class="per">${esc(s.parcours)}</p>
    <p class="det"><b>Œuvre :</b> ${esc(s.oeuvre)}<br><b>Cursive / support :</b> ${esc(s.cursive||'—')}<br>${esc(s.detail)}</p></div>`).join('');
  const jalAvenir=d.jalons.filter(j=>j.etat==='à venir').map(j=>`<li><b>${fmtS(j.date)}</b> — ${esc(j.txt)}</li>`).join('');
  const jalPasse=d.jalons.filter(j=>j.etat!=='à venir').slice(-6).map(j=>`<li><b>${fmtS(j.date)}</b> — ${esc(j.txt)}</li>`).join('');
  $('#synthese').innerHTML=`
    <div class="shead"><h2>Synthèse</h2><small>vue de tableau de bord · ${d.meta.sourcePronote}</small></div>
    <div class="grid2">
      <div class="card"><h3>Jalons à venir</h3><ul>${jalAvenir||'<li>—</li>'}</ul></div>
      <div class="card"><h3>Derniers jalons franchis</h3><ul>${jalPasse||'<li>—</li>'}</ul></div>
    </div>
    <div class="shead" style="margin-top:26px"><h2>Séquences</h2><small>progression : <span class="badge ${d.progression.statut==='établie'?'ok':'chantier'}">${d.progression.statut}</span></small></div>
    <div class="grid2">${seqCards}</div>`;

  /* ===== Priorités ===== */
  const prioCol=(t,cls)=>`<div class="card"><h3>${t}</h3><ul>${d.priorites[cls].map(p=>
      `<li>${p.fait?'✅ ':''}${esc(p.txt)}${p.echeance?` <small style="color:var(--soft)">(${esc(p.echeance)})</small>`:''}</li>`).join('')}</ul></div>`;
  $('#priorites').innerHTML=`<div class="shead"><h2>Priorités</h2><small>court / moyen / long terme — mise à jour ${d.meta.sourcePronote}</small></div>
    <div class="grid2">${prioCol('Court terme','court')}${prioCol('Moyen terme','moyen')}${prioCol('Long terme','long')}</div>`;

  /* ===== Pronote ===== */
  const fmtTxt=s=>(s||'').replace(/\s*(Objectifs?|Déroulé|Pour le |Trace écrite|Contrôle :|I{1,3}\. |IV\. |V\. |1\) |2\) |3\) |4\) |5\) |6\) |7\) )/g,m=>'\n\n'+m.trim()+' ');
  const stCls={'publié':'publie','distanciel':'distanciel','réalisé non publié':'non-publie','à saisir':'a-saisir'};
  let filtre='tous';
  const renderSeances=()=>{
    const list=d.seances.filter(s=>filtre==='tous'||s.statut===filtre);
    $('#seanceList').innerHTML=list.map((s,i)=>{
      const dt=new Date(s.date+'T12:00:00');
      return `<article class="seance" data-i="${d.seances.indexOf(s)}">
      <div class="head">
        <div class="date"><b>${dt.getDate()}</b><span>${dt.toLocaleDateString('fr-FR',{month:'short'})} ${dt.getFullYear()}</span><span>${s.time} · ${s.hours} h</span></div>
        <div class="body">
          <p class="t">${s.titre?esc(s.titre):'<i style="color:var(--soft)">Créneau non saisi</i>'} <span class="st ${stCls[s.statut]||'a-saisir'}">${s.statut}</span></p>
          ${s.resume?`<p class="r">${esc(s.resume)}…</p>`:''}
          <div class="flags">${s.cat?`<span class="tag-chip" style="border-color:var(--c);color:var(--c)">${esc(s.cat)}</span>`:''}${s.theme?`<span class="tag-chip">${esc(s.theme)}</span>`:''}${s.absents?`<span class="tag-chip">${s.absents} absent(s)</span>`:''}${s.afaire.length?`<span class="tag-chip">→ à faire donné</span>`:''}</div>
        </div>
        <div class="open">+</div>
      </div>
      <div class="detail">
        <h4>Contenu de la séance</h4>
        <div class="content">${esc(fmtTxt(s.contenu))||'—'}</div>
        ${s.elements.length?`<div class="els"><h4>Éléments du programme cochés</h4><ul>${s.elements.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}
        ${s.afaire.length?`<div class="els"><h4>À faire</h4><ul>${s.afaire.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
      </div></article>`;
    }).join('')||'<p style="color:var(--soft);padding:20px">Aucune séance pour ce filtre.</p>';
    document.querySelectorAll('.seance .head').forEach(h=>h.addEventListener('click',()=>h.parentElement.classList.toggle('open')));
  };
  const FILTRES=[['tous','Toutes'],['publié','Publiées'],['distanciel','Distanciel'],['réalisé non publié','Non publiées'],['à saisir','À saisir']];
  $('#pronote').innerHTML=`<div class="shead"><h2>Pronote détaillé</h2><small>cahier de textes complet, scroll vertical · cliquer pour le détail — ${d.meta.sourcePronote}</small></div>
    <div class="filters" id="filters"></div><div class="seances" id="seanceList"></div>`;
  $('#filters').innerHTML=FILTRES.map(([k,t])=>`<button data-f="${k}">${t} <span style="opacity:.55">${k==='tous'?d.seances.length:d.seances.filter(s=>s.statut===k).length}</span></button>`).join('');
  document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{filtre=b.dataset.f;
    document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));renderSeances();}));
  document.querySelector('#filters button').classList.add('on');renderSeances();

  /* ===== Timeline ===== */
  const start=new Date('2026-09-01'),end=new Date('2027-06-30'),DAYS=Math.round((end-start)/86400000),PXD=7.2,AX=DAYS*PXD;
  const X=ds=>Math.round((new Date(ds+'T12:00:00')-start)/86400000*PXD);
  const vacs=(d.vacances||[]).map(v=>`<div class="tl-vac" style="left:${X(v.debut)}px;width:${Math.max(3,X(v.fin)-X(v.debut))}px" title="${esc(v.txt)}"></div>`).join('');
  const mois=MOIS.map((m,i)=>{const yy=i<4?2026:2027,mm=i<4?9+i:i-3;const first=new Date(yy,mm-1,1),last=new Date(yy,mm,0);
    const w=Math.round((last-first)/86400000*PXD);return `<div style="width:${w}px"><b>${m}</b><small>${yy}</small></div>`;}).join('');
  const evJalons=d.jalons.map(j=>{const x=X(j.date);
    const cls=j.etat==='à venir'?'todo':(j.date>=NOW?'now':'done');
    return `<button class="tl-ev ${cls} ${j.type==='bac-blanc'||j.type==='eaf'?'exam':j.type==='inspection'?'insp':j.type==='conseil'?'vac':''}" style="left:${x}px" data-d="${j.date}" data-t="${esc(j.txt)}"><i></i><span>${esc(j.txt)}</span></button>`;}).join('');
  const evSeances=d.seances.map(s=>{const x=X(s.date);
    const cls=s.statut==='publié'?'done':s.statut==='à saisir'?'todo':'now';
    return `<button class="tl-ev ${cls}" style="left:${x}px" data-d="${s.date} ${s.time}" data-t="${esc(s.titre||'Créneau non saisi')} (${s.statut})"><i></i><span>${fmtS(s.date)} · ${s.hours}h</span></button>`;}).join('');
  const nowX=X(NOW);
  $('#timeline').innerHTML=`<div class="shead"><h2>Timeline annuelle</h2><small>septembre → juin, scroll horizontal · cliquer une pastille pour le détail</small></div>
    <div class="tl-viewport"><div style="min-width:${AX+20}px">
      <div class="tl-scale">${mois}</div>
      <div class="tl-row" style="height:170px">${vacs}<div class="tl-now" style="left:${nowX}px"></div>${evJalons}</div>
      <div class="tl-row">${vacs}<div class="tl-now" style="left:${nowX}px"></div>${evSeances}</div>
    </div></div>
    <div class="tl-legend" style="background:var(--card)">
      <span><i style="background:#7d8f6a"></i>réalisé</span><span><i style="background:var(--terra)"></i>en cours / non publié</span>
      <span><i style="background:#b9c4cf"></i>à venir</span><span><i style="background:var(--red)"></i>échéance</span>
      <span><i style="background:var(--plum)"></i>inspection</span><span><i style="background:var(--gold)"></i>conseil / vacances</span>
      <span style="margin-left:auto">Rangée 1 : jalons · rangée 2 : séances</span></div>`;
  document.querySelectorAll('.tl-ev').forEach(b=>b.addEventListener('click',()=>pop('Événement',fmtD(b.dataset.d.split(' ')[0]),b.dataset.t)));
  const vp=document.querySelector('.tl-viewport');requestAnimationFrame(()=>vp.scrollLeft=Math.max(0,nowX-vp.clientWidth*.4));

  /* ===== Progression ===== */
  const pistes=(d.progression.pistes||[]).map(p=>`<div class="card"><h3>${esc(p.titre)}</h3><p class="det">${esc(p.detail)}</p></div>`).join('');
  const tr=d.progression.transversal?`<div class="card seq" style="--c:${d.progression.transversal.couleur};margin-top:14px">
    <span class="no">Transversal · ${esc(d.progression.transversal.periode)}</span><h3>${esc(d.progression.transversal.titre)}<span class="badge work">${esc(d.progression.transversal.etat)}</span></h3>
    <p class="det">${esc(d.progression.transversal.detail)}</p></div>`:'';
  $('#progression').innerHTML=`<div class="shead"><h2>Progression annuelle</h2><small>statut : <span class="badge ${d.progression.statut==='établie'?'ok':'chantier'}">${d.progression.statut}</span> ${d.progression.statut!=='établie'?'— les pistes ci-dessous sont en discussion, rien n\u2019est figé':''}</small></div>
    <p style="font-size:12.5px;color:var(--soft);margin:6px 0 0">${esc(d.progression.source)}</p>
    <div class="grid2" style="margin-top:16px">${seqCards}</div>${tr}
    ${pistes?`<div class="shead" style="margin-top:26px"><h2 style="font-size:19px">Possibilités à l\u2019étude</h2><small>chantier — à co-construire</small></div><div class="grid2">${pistes}</div>`:''}`;

  /* ===== Programme ===== */
  const blocs=d.programme.map(b=>{const vu=b.items.filter(i=>i.n>0).length,pct=Math.round(vu/b.items.length*100);
    return `<div class="bloc"><h3>${esc(b.bloc)}<small>${vu}/${b.items.length} items abordés</small></h3>
      <div class="cov"><i style="width:${pct}%"></i></div>
      ${b.items.map(i=>`<div class="it ${i.n>0?'vu':'pas'}"><span class="n ${i.n>0?'vu':'pas'}">${i.n>0?'×'+i.n:'—'}</span><span class="lbl">${esc(i.label)}</span></div>`).join('')}</div>`;}).join('');
  const totIt=d.programme.reduce((a,b)=>a+b.items.length,0), totVu=d.programme.reduce((a,b)=>a+b.items.filter(i=>i.n>0).length,0);
  $('#programme').innerHTML=`<div class="shead"><h2>Éléments du programme</h2><small>référentiel Pronote × exports cochés : ${totVu}/${totIt} items abordés (${Math.round(totVu/totIt*100)}%)</small></div>
    <div class="grid2" style="margin-top:14px">${blocs}</div>`;

  /* ===== Grammaire ===== */
  const g1=d.grammaire.vus.map(g=>`<div class="it2"><b>${esc(g.titre)}</b><small>${g.date?'vu le '+esc(g.date):''}</small></div>`).join('');
  const g2=d.grammaire.aVoir.map(g=>`<div class="it2"><b>${esc(g.titre)}</b><small>${g.echeance?'cible : '+esc(g.echeance):''}</small></div>`).join('');
  $('#grammaire').innerHTML=`<div class="shead"><h2>Grammaire & langue</h2><small>points vus / points à voir</small></div>
    <div class="two" style="margin-top:14px">
      <div class="card"><h3 style="color:var(--forest)">Vus</h3>${g1}</div>
      <div class="card"><h3 style="color:var(--terra)">À voir</h3>${g2}</div></div>`;

  /* ===== Culture ===== */
  const aut=d.culture.auteursTextes.map(a=>`<div class="it2"><b>${esc(a.titre)}</b><small>${esc(a.contexte)}</small></div>`).join('');
  const refs=d.culture.referencesCulturelles.map(r=>`<li>${esc(r)}</li>`).join('');
  const per=d.culture.periodes.map(p=>`<div class="card"><h3>${esc(p.titre)}</h3><p class="det">${esc(p.detail)}</p></div>`).join('');
  const mots=(d.culture.motsConcepts||[]).map(m=>`<span class="mot">${esc(m)}</span>`).join('');
  $('#culture').innerHTML=`<div class="shead"><h2>Auteurs, textes & références culturelles</h2><small>le capital culturel construit depuis septembre</small></div>
    <div class="grid2" style="margin-top:14px">
      <div class="card"><h3>Auteurs & textes vus</h3>${aut}</div>
      <div class="card"><h3>Références culturelles abordées</h3><ul>${refs}</ul>
        ${mots?`<h3 style="margin-top:18px">Mots-concepts construits</h3><div class="mots">${mots}</div>`:''}</div>
    </div>
    <div class="shead" style="margin-top:24px"><h2 style="font-size:19px">Périodes historiques</h2></div>
    <div class="grid2">${per}</div>`;

  $('#foot').innerHTML=`Sources — ${esc(d.meta.sourcePronote)} · Budget : ${esc(d.meta.sourceBudget)} · Cockpits v2`;

  function pop(t,date,txt){$('#popBody').innerHTML=`<div class="kicker">${t}</div><h3 style="font:600 24px/1.25 'Fraunces',serif;margin:10px 0">${esc(date)}</h3><p style="font-size:14px;line-height:1.7;color:#4d5b58">${esc(txt)}</p>`;
    $('#veil').classList.add('open');}
  $('#xClose').onclick=()=>$('#veil').classList.remove('open');
  $('#veil').onclick=e=>{if(e.target.id==='veil')$('#veil').classList.remove('open')};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#veil').classList.remove('open')});
}
main().catch(err=>{
  console.error(err);
  document.body.insertAdjacentHTML('afterbegin','<div style="padding:12px 18px;background:#b03d38;color:white;font:600 13px Inter,sans-serif">Impossible de charger ce cockpit. Vérifier le serveur local et les fichiers JSON.</div>');
});
</script>
</body>
</html>
