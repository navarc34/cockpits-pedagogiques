<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Cockpit de cours</title>
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/cockpit.css">
<style>
:root{--wrap:1460px}
.kicker{margin-top:16px;display:block}
.bar{height:7px;margin-top:9px}
a{color:inherit}
.back{font-size:12px;font-weight:700;color:var(--soft);text-decoration:none}
h1{font:600 clamp(28px,4.4vw,50px)/1.04 Fraunces,Georgia,serif;margin:8px 0 6px;letter-spacing:-.02em}
h2{font:600 24px Fraunces,serif;margin:0 0 4px}
.sub{color:var(--soft);font-size:13px;margin:0;max-width:900px}
.hero{padding:32px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}
.kpi{padding:15px 17px}.kpi b{display:block;font:600 26px Fraunces,serif}.kpi b i{font:700 11px Inter;font-style:normal;color:var(--soft)}.kpi span{font-size:11.5px;color:var(--soft)}
nav.tabs{position:sticky;top:0;z-index:30;display:flex;gap:7px;overflow-x:auto;padding:10px 0;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.tabs a{flex:none;text-decoration:none;font-size:12.5px;font-weight:700;color:var(--soft);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;transition:background .15s}
nav.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{display:none;margin-top:26px}section.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:16px}
.card{padding:20px}.card h3{font:600 18px Fraunces,serif;margin:0 0 10px}
.card ul{list-style:none;margin:0;padding:0}.card li{padding:8px 0;border-top:1px solid var(--line);font-size:13px}.card li:first-child{border:0}
.st,.badge{display:inline-block;font:800 10.5px Inter;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:3px 8px;color:#fff}
.st.publie,.badge.ok{background:var(--ok)}.st.distanciel,.badge.work{background:var(--gold)}.st.non-publie,.badge.chantier{background:var(--warn)}.st.a-saisir{background:var(--slate)}.badge.plan{background:var(--slate)}.badge{margin-left:8px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 12px}.filters button{border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;padding:7px 14px;font:700 11.5px Inter;cursor:pointer}.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seances{display:flex;flex-direction:column;gap:10px}.seance{overflow:hidden}
.seance .head{display:flex;gap:14px;padding:15px 18px;cursor:pointer}.seance .head:hover{background:color-mix(in srgb,var(--c) 6%,transparent)}
.seance .date{flex:none;width:92px;text-align:center;border-right:1px solid var(--line);padding-right:14px}.seance .date b{display:block;font:600 22px Fraunces,serif}.seance .date span{display:block;font-size:10.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.seance .body{flex:1;min-width:0}.seance .t{font-weight:700;font-size:14px;margin:0 0 3px}.seance .r{font-size:12.5px;color:var(--soft);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:600;color:var(--soft);margin:7px 6px 0 0}
.detail{display:none;border-top:1px solid var(--line);padding:18px 20px}.seance.open .detail{display:block}.seance.open .plus{transform:rotate(45deg)}.plus{font-size:20px;color:var(--soft);transition:transform .2s}
.detail h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin:0 0 7px}.detail .content{white-space:pre-wrap;font-size:13px;max-height:420px;overflow:auto}.detail li{padding:6px 0;border-top:1px solid var(--line);font-size:12.5px;list-style:none}.detail ul{margin:14px 0 0;padding:0}
.tl{overflow-x:auto;scrollbar-width:thin}.tl>div{position:relative}
.tl-scale{display:flex;border-bottom:1px solid var(--line)}.tl-scale div{flex:none;padding:9px 0;text-align:center;border-left:1px solid var(--line);font:800 11px Inter;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}.tl-scale b{display:block;font:600 15px Fraunces,serif;color:var(--ink);text-transform:none;letter-spacing:0}
.tl-row{position:relative}.tl-vac{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#b5a1781f 0 3px,transparent 3px 7px);border-inline:1px dashed #b5a17866}.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--terra);z-index:9}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--slate)}.dot.publie{background:var(--ok)}.dot.distanciel{background:var(--gold)}.dot.non-publie{background:var(--warn)}
.tlbar{display:flex;gap:10px;align-items:center;margin:12px 0}.tlbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:700 11.5px Inter;cursor:pointer}
.seq{border-left:5px solid var(--c)}.seq .no{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}.seq h3{margin:4px 0 2px}.seq .per{font-size:12px;color:var(--soft);font-weight:700;margin:0 0 8px}.det{font-size:12.5px;margin:0}
.cov{height:6px;border-radius:5px;background:var(--empty);overflow:hidden;margin:10px 0}.cov i{display:block;height:100%;background:var(--ok)}
.it{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}.it .n{flex:none;min-width:28px;text-align:center;font-size:10.5px;font-weight:800;border-radius:5px;padding:3px 4px;background:var(--empty);color:var(--soft)}.it.vu .n{background:var(--ok);color:#fff}.it.pas .lbl{color:var(--soft)}
.bloc h3{display:flex;justify-content:space-between;gap:10px;font-size:16px}.bloc h3 small{font:700 11px Inter;color:var(--soft)}
.it2{padding:10px 0;border-top:1px solid var(--line);font-size:13px}.it2:first-child{border:0}.it2 b{display:block}.it2 small{color:var(--soft)}
.mots{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.mot{background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 13px;font:600 13px Fraunces,serif;font-style:italic}
.veil{position:fixed;inset:0;background:#10191777;z-index:60;display:none;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(4px)}.veil.open{display:flex}
.pop{position:relative;max-width:560px;width:100%;padding:28px;max-height:85vh;overflow:auto}.pop .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border:0;border-radius:50%;background:var(--empty);color:var(--ink);cursor:pointer;font-size:18px}
footer{margin:56px 0 36px;color:var(--soft);font-size:11.5px;border-top:1px solid var(--line);padding-top:14px}
.tl{cursor:grab}.tl.panning,.tl.panning *{cursor:grabbing!important;user-select:none}
.ev{position:absolute;width:0;height:0;z-index:5}.ev .pin{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--slate);z-index:2}
.ev.done .pin{background:var(--ok)}.ev.todo .pin{background:var(--sea)}.ev.exam .pin{background:var(--red)}
.ev .card{position:absolute;left:-6px;top:14px;width:max-content;max-width:124px;padding:5px 8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 10.5px/1.25 Inter,sans-serif;text-align:left;cursor:grab;touch-action:none;user-select:none;box-shadow:var(--sh);z-index:1}
.ev .card small{display:block;color:var(--soft);font-size:10px}.ev .card.dragging{cursor:grabbing;box-shadow:0 12px 28px #28344055;border-color:var(--c)}
.ev .thread{position:absolute;left:0;top:0;height:1px;background:var(--soft);opacity:.55;transform-origin:0 0;pointer-events:none}
.agenda{display:none}.ag{display:grid;grid-template-columns:70px 14px 1fr;gap:10px;padding:10px 4px;border-top:1px solid var(--line);font-size:13px}.ag.past{opacity:.5}.ag time{font-weight:700}.ag i{width:11px;height:11px;border-radius:50%;margin-top:4px;background:var(--sea)}.ag.done i{background:var(--ok)}.ag.exam i{background:var(--red)}.ag.vac i{background:var(--gold);border-radius:3px}.ag em{display:block;font-style:normal;font-size:11px;color:var(--soft)}
.agm{font:600 18px Fraunces,serif;margin:18px 0 4px;text-transform:capitalize}.agnow{background:var(--terra);color:#fff;border-radius:8px;padding:6px 12px;font:700 11.5px Inter;margin:8px 0}
@media(max-width:700px){.tl,.desk{display:none!important}.agenda{display:block}}
@media(max-width:700px){.seance .date{width:64px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><a class="back" href="index.html">← Cockpit général</a><span class="kicker" id="kick"></span><h1 id="title"></h1><p class="sub" id="sub"></p><div class="kpis" id="kpis"></div></header>
<nav class="tabs" id="tabs" aria-label="Rubriques du cours"></nav>
<p class="loading" id="loading">Chargement…</p>
<section id="synthese"></section><section id="priorites"></section><section id="journal"></section><section id="pronote"></section><section id="timeline"></section><section id="progression"></section><section id="programme"></section><section id="grammaire"></section><section id="culture"></section>
<footer id="foot"></footer>
</div>
<div class="veil" id="veil" role="dialog" aria-modal="true" aria-label="Détail"><div class="pop glass"><button class="x" id="xClose" aria-label="Fermer">×</button><div id="popBody"></div></div></div>
<script>
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const col=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#5f7280';
const NOW=(()=>{const q=new URLSearchParams(location.search).get('now');return /^\d{4}-\d{2}-\d{2}$/.test(q||'')?q:new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris'}).format(new Date());})();
async function load(u){const url=new URL(u,location.href);url.searchParams.set('_v',Date.now().toString());const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(u+' : HTTP '+r.status);return r.json();}
const $=s=>document.querySelector(s),D=s=>new Date(s+'T12:00:00'),fl=(s,o)=>D(s).toLocaleDateString('fr-FR',o);
const iso=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
const FD={day:'numeric',month:'short'},FL={weekday:'long',day:'numeric',month:'long',year:'numeric'};
const stCls={'publié':'publie','distanciel':'distanciel','réalisé non publié':'non-publie','à saisir':'a-saisir'};
const fmtTxt=s=>(s||'').replace(/\s*(Objectifs?|Déroulé|Pour le |Trace écrite|Contrôle :|I{1,3}\. |IV\. |V\. |1\) |2\) |3\) |4\) |5\) |6\) |7\) )/g,m=>'\n\n'+m.trim()+' ');
const S0=D('2026-08-31'),T0=D('2026-09-01'),T1=D('2027-06-30');
function heat(d){const by={};d.seances.forEach(s=>(by[s.date]=by[s.date]||[]).push(s));let h='';
  for(let w=0;w<44;w++)for(let r=0;r<5;r++){const t=new Date(S0);t.setDate(S0.getDate()+w*7+r);const x=iso(t),se=by[x];
    const st=se?(se.some(y=>y.statut==='à saisir')?'sa':se.some(y=>y.statut==='réalisé non publié')?'np':se.every(y=>y.statut==='distanciel')?'di':'ok'):'';
    h+=`<i class="${[st,(d.vacances||[]).some(v=>x>=v.debut&&x<=v.fin)?'v':'',x===NOW?'td':'',x>'2027-06-30'?'x':''].join(' ').trim()}" title="${esc(fl(x,FD)+(se?' · '+se.map(y=>y.titre||'non saisi').join(' / '):''))}"></i>`;}
  return `<div class="hm" aria-hidden="true">${h}</div><div class="leg"><span><i style="background:var(--c)"></i>publié</span><span><i style="background:color-mix(in srgb,var(--c) 55%,var(--bg))"></i>distanciel</span><span><i style="background:var(--gold)"></i>non publié</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--red)"></i>à saisir</span><span><i style="background:repeating-linear-gradient(45deg,var(--empty) 0 2px,transparent 2px 4px)"></i>vacances</span></div>`;}
async function main(){
  const id=new URLSearchParams(location.search).get('id')||'fr';
  const d=await load(`data/${['fr','option','spe'].includes(id)?id:'fr'}.json`);
  d.seances.forEach(s=>{s.afaire=s.afaire||[];s.elements=s.elements||[];});
  $('#loading').remove();
  document.documentElement.style.setProperty('--c',col(d.meta.couleur));
  document.title=d.meta.nom+' · Cockpit';
  const b=d.budget,pct=b.consomme/b.total;
  const past=d.seances.filter(s=>s.date<=NOW),SUM=(a,f)=>a.reduce((x,s)=>x+(s.hours||0)*(f?f(s):1),0);
  const prevu=Math.round(SUM(past)),declar=Math.round(SUM(past,s=>s.statut!=='à saisir')),aSais=Math.round(SUM(past,s=>s.statut==='à saisir'));
  const nPub=d.seances.filter(s=>s.statut==='publié').length,late=past.filter(s=>s.statut==='à saisir').length;
  $('#kick').textContent='Cockpit de cours · 2026-2027';$('#title').textContent=d.meta.nom;
  $('#sub').textContent=`${d.meta.classe} · créneaux : ${d.meta.creneaux} (${d.meta.rythme}). ${d.meta.noteMultiniveau||''}`;
  $('#kpis').innerHTML=`<div class="kpi glass"><b>${prevu}<i> h</i></b><span>prévues à ce jour (plan de séances, sur ${b.total} h)</span><div class="bar"><i style="width:${Math.round(Math.min(1,prevu/b.total)*100)}%"></i></div></div>
  <div class="kpi glass"><b>${declar}<i> h</i></b><span>saisies dans Pronote à ce jour (publiées, distanciel ou non publiées)</span><div class="bar"><i style="width:${Math.round(Math.min(1,declar/Math.max(1,prevu))*100)}%"></i></div></div>
  <div class="kpi glass"><b style="color:${aSais?'var(--red)':'var(--ok)'}">${aSais}<i> h</i></b><span>${aSais?'en attente de saisie dans Pronote — retard administratif, séances réalisées':'saisie Pronote à jour'}</span></div>
  <div class="kpi glass"><b>${nPub}<i>/${d.seances.length}</i></b><span>séances publiées</span></div>
  <div class="kpi glass"><b style="color:${late?'var(--red)':'var(--ok)'}">${late}</b><span>créneau${late>1?'x':''} passé${late>1?'s':''} à saisir</span></div>`;
  const TABS=[['synthese','Synthèse'],['priorites','Priorités'],['journal','Journal de bord'],['pronote','Pronote'],['timeline','Timeline'],['progression','Progression'],['programme','Programme'],['grammaire','Grammaire'],['culture','Culture']];
  $('#tabs').innerHTML=TABS.map(([k,t])=>`<a href="#${k}" data-t="${k}">${t}</a>`).join('');
  $('#tabs').insertAdjacentHTML('beforeend','<a href="trajectoire.html" title="Pilotage pédagogique du français">Trajectoire ↗</a>');
  let tlRedraw=()=>{};
  const route=()=>{const h=location.hash.slice(1),k=TABS.some(t=>t[0]===h)?h:'synthese';
    document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===k));
    document.querySelectorAll('nav.tabs a').forEach(a=>{const on=a.dataset.t===k;a.classList.toggle('on',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});requestAnimationFrame(()=>tlRedraw());};
  window.addEventListener('hashchange',route);route();
  const head=(t,s)=>`<div class="shead"><h2>${t}</h2><small>${s||''}</small></div>`;
  const bdg=e=>String(e).startsWith('en cours')?'work':/^(planifi|à lancer)/.test(e)?'plan':/^(faite|clos)/.test(e)?'ok':'work';
  const seq=(d.progression.sequences||[]).map(s=>`<div class="card glass seq" style="--c:${col(s.couleur)}"><span class="no">${esc(s.no)} · ${esc(s.periode)}</span><h3>${esc(s.titre)}<span class="badge ${bdg(s.etat)}">${esc(s.etat)}</span></h3><p class="per">${esc(s.parcours)}</p><p class="det"><b>Œuvre :</b> ${esc(s.oeuvre)}<br><b>Support :</b> ${esc(s.cursive||'—')}<br>${esc(s.detail)}</p></div>`).join('');
  const li=a=>a.map(j=>`<li><b>${fl(j.date,FD)}</b> — ${esc(j.txt)}</li>`).join('')||'<li>—</li>';
  const J=[...d.jalons].sort((x,y)=>x.date<y.date?-1:1);
  $('#synthese').innerHTML=head('Synthèse','l’année en un coup d’œil')+`<div class="card glass" style="margin-top:16px"><h3>Carte de l’année</h3>${heat(d)}</div><div class="grid"><div class="card glass"><h3>Jalons à venir</h3><ul>${li(J.filter(j=>j.etat==='à venir'))}</ul></div><div class="card glass"><h3>Derniers jalons franchis</h3><ul>${li(J.filter(j=>j.etat!=='à venir').slice(-6).reverse())}</ul></div></div>`;
  // Priorités : les tâches échues restent visibles, mais dans leur propre liste.
  const sorted=a=>[...a].sort((x,y)=>(x.dateEcheance||'9999-12-31').localeCompare(y.dateEcheance||'9999-12-31'));
  const court=d.priorites.court||[];
  const avenir=sorted(court.filter(p=>!p.fait&&(!p.dateEcheance||p.dateEcheance>=NOW))).sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0));
  const retard=sorted(court.filter(p=>!p.fait&&p.dateEcheance&&p.dateEcheance<NOW));
  const terminees=sorted(court.filter(p=>p.fait));
  const lateSe=d.seances.filter(s=>s.statut==='à saisir'&&s.date<=NOW);
  const item=(p)=>`<li>${p.urgent?`<b style="color:var(--red)">⚑ URGENT</b> `:''}${esc(p.txt)}${p.echeance?` <small style="color:var(--soft)">(${esc(p.echeance)})</small>`:''}${!p.dateEcheance?` <small style="color:var(--soft)">· date à fixer</small>`:''}</li>`;
  const group=(titre,items,empty)=>`<div class="card glass"><h3>${titre} <small style="font:600 12px Inter;color:var(--soft)">(${items.length})</small></h3><ul>${items.map(item).join('')||`<li style="color:var(--soft)">${empty}</li>`}</ul></div>`;
  const alert=lateSe.length?`<li><span aria-hidden="true">🔔</span> <b>Saisir Pronote :</b> ${lateSe.length} créneau${lateSe.length>1?'x':''} passé${lateSe.length>1?'s':''} non publié${lateSe.length>1?'s':''} (${lateSe.map(s=>fl(s.date,FD)).join(', ')})</li>`:'';
  const overdue=`<div class="card glass"><h3>En retard <small style="font:600 12px Inter;color:var(--soft)">(${retard.length+ (lateSe.length?1:0)})</small></h3><ul>${alert}${retard.map(item).join('')||(!alert?'<li style="color:var(--soft)">Aucune priorité en retard.</li>':'')}</ul></div>`;
  const done=`<div class="card glass"><details><summary style="cursor:pointer;font:600 20px Fraunces,serif">Terminées (${terminees.length})</summary><ul>${terminees.map(item).join('')||'<li>Aucune priorité terminée.</li>'}</ul></details></div>`;
  const pcol=(t,k)=>group(t,d.priorites[k]||[],'Aucune priorité.');
  $('#priorites').innerHTML=head('Priorités','à venir · en retard · terminées · horizons moyen et long')+
    `<div class="grid">${group('À venir',avenir,'Aucune échéance à venir.')}${overdue}${done}</div>`+
    `<div class="grid" style="margin-top:18px">${pcol('Moyen terme','moyen')+pcol('Long terme','long')}</div>`;
  // Journal de bord (bilans de séance H{n}) : 3 rubriques, items classés par date
  const jitems=(k)=>[...(d.journal||[])].flatMap(e=>{const jt=(d.seances||[]).filter(s=>s.date===e.date&&s.titre).map(s=>s.titre).join(' · ')||e.contexte||'';const c=jt.length>72?jt.slice(0,71)+'…':jt;return (e[k]||[]).map(t=>({date:e.date,ctxt:c,txt:t}));}).sort((a,b)=>b.date.localeCompare(a.date));
  const jcol=(t,k,ic,empty)=>{const a=jitems(k);return `<div class="card glass"><h3>${ic} ${t} <small style="font:600 12px Inter;color:var(--soft)">(${a.length})</small></h3><ul>${a.map(x=>`<li><small style="color:var(--soft);font-weight:600">${fl(x.date,FD)} —</small> <span style="color:var(--c);font-weight:600">[${esc(x.ctxt)}]</span> ${esc(x.txt)}</li>`).join('')||`<li style="color:var(--soft)">${empty}</li>`}</ul></div>`;};
  $('#journal').innerHTML=head('Journal de bord','bilans de séance, items classés par date · entre crochets : le titre de la séance Pronote correspondante')+
    `<div class="grid">${jcol('Ce qui a marché','marche','✅','Aucun point collecté.')}${jcol('À améliorer','aAmeliorer','⚠️','Aucun point collecté.')}${jcol('Pistes et idées','idees','💡','Aucune piste collectée.')}</div>`;
  // Pronote
  let f='tous';const FIL=[['tous','Toutes'],['publié','Publiées'],['distanciel','Distanciel'],['réalisé non publié','Non publiées'],['à saisir','À saisir']];
