name: validate
on:
  push:
    branches: [dev, main, dev-chatgpt]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validation du modèle et du contrat vue
        run: python scripts/validate.py
