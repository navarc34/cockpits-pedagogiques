name: Validation et confidentialité

# Garde de confidentialité + validation des données et du JS inline,
# exécutées à chaque push. Toute fuite bloque le build AVANT la mise en ligne
# de GitHub Pages (déploiement Pages = fin de pipeline : il ne part que si les
# étapes précédentes réussissent).

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer la validation du schéma pilotage
        run: python3 -m pip install jsonschema==4.23.0
      - name: Garde de confidentialité
        run: python3 scripts/check_privacy.py
      - name: Validation des données et de la syntaxe JS
        run: python3 scripts/validate.py
      - name: Contrat de pilotage et tests de rejet
        run: python3 tests/test_pilotage.py
      - name: Contrat du calendrier prévisionnel
        run: python3 tests/test_calendrier.py
      - name: Tests de récurrence et de rapprochement
        run: node tests/test_calendrier.cjs
      - name: Reconnaissance et traçabilité des séances
        run: node tests/test_preuves.cjs
      - name: Trajectoire annuelle et validation des allocations
        run: python3 tests/test_trajectoire.py
      - name: Simulateur de scénarios et projections
        run: node tests/test_projection.cjs
